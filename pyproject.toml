[project]
name = "alfaco-monorepo"
version = "0.2.0"
description = "Monorepo des plugins Sublime Text Alfaco"
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "requests-mock>=1.11",
    "requests>=2.28",
]

[tool.pytest.ini_options]
testpaths = ["plugins"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
